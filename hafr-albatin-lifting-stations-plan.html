<title>خطط العمل والجداول الزمنية</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap"><style id="app-css">
/* Layout: a field-office sheet. Header + KPI strip, then two tabs: an RTL Gantt (sticky task list on the right, time flowing right-to-left) and an editable work plan. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#E9EFF1; --ink:#0F2129; --muted:#5A6B73; --line:#D4DDE1; --line-soft:#E6ECEF;
  --accent:#0A6C88; --accent-ink:#FFFFFF; --accent-soft:#DCEDF2;
  --ok:#2C7A4D; --ok-soft:#E0F0E6; --warn:#A86E12; --warn-soft:#F9EDD6; --bad:#BF3F2B; --bad-soft:#FAE2DD;
  --c1:#3D6F9E; --c2:#7357A6; --c3:#A87512; --c4:#8A6648; --c5:#12837F; --c6:#B0466A; --c7:#4A8636; --c8:#56636E;
  --weekend:rgba(10,108,136,.045);
  --font-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --side:452px; --row:34px; --radius:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1519; --surface:#142027; --surface-2:#1A2830; --ink:#E2EBEE; --muted:#93A5AD; --line:#2A3A42; --line-soft:#1F2D34;
  --accent:#4FB2CE; --accent-ink:#06222B; --accent-soft:#16343F;
  --ok:#5FC08A; --ok-soft:#163327; --warn:#E0A640; --warn-soft:#3A2D14; --bad:#EF7A66; --bad-soft:#3D1E19;
  --c1:#6E9DCB; --c2:#A48AD6; --c3:#D9A443; --c4:#BC9878; --c5:#48B8B2; --c6:#DD7A9C; --c7:#7DBC67; --c8:#8C9AA6;
  --weekend:rgba(79,178,206,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1519; --surface:#142027; --surface-2:#1A2830; --ink:#E2EBEE; --muted:#93A5AD; --line:#2A3A42; --line-soft:#1F2D34;
  --accent:#4FB2CE; --accent-ink:#06222B; --accent-soft:#16343F;
  --ok:#5FC08A; --ok-soft:#163327; --warn:#E0A640; --warn-soft:#3A2D14; --bad:#EF7A66; --bad-soft:#3D1E19;
  --c1:#6E9DCB; --c2:#A48AD6; --c3:#D9A443; --c4:#BC9878; --c5:#48B8B2; --c6:#DD7A9C; --c7:#7DBC67; --c8:#8C9AA6;
  --weekend:rgba(79,178,206,.06); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;direction:rtl}
#app{max-width:1440px;margin-inline:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){#app{padding:14px 16px 32px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;font-weight:600}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--accent);font-weight:600}
.top h1{font-size:clamp(22px,3.2vw,30px);line-height:1.25}
.sub{color:var(--muted);font-size:13px}
.savebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--accent-soft);border-radius:var(--radius);padding:10px 14px;font-size:13px}
.banner.warn{background:var(--warn-soft)}
.banner p{margin:0;flex:1 1 280px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.dual{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.dual i{position:absolute;inset-block:0;right:0;border-radius:4px}
.dual .pl{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.dual .ac{background:var(--accent);inset-block:2px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:600;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)}

/* tabs + toolbar */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
select.btn{padding-inline-end:28px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}

/* gantt */
.gantt{position:relative;overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overscroll-behavior:contain}
.g{position:relative}
.g-head{position:sticky;top:0;z-index:5;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.r{display:flex;height:var(--row);border-bottom:1px solid var(--line-soft)}
.side{position:sticky;right:0;z-index:3;flex:0 0 var(--side);width:var(--side);background:var(--surface);display:grid;grid-template-columns:44px minmax(0,1fr) 70px 50px 48px;align-items:center;border-inline-end:1px solid var(--line);font-size:13px}
.side>*{padding-inline:6px;min-width:0}
.g-head .side{z-index:6;height:56px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.time-h{position:relative;height:56px;flex:none}
.tier{position:absolute;inset-inline:0;height:28px}
.tier.t1{top:0;border-bottom:1px solid var(--line-soft)} .tier.t2{top:28px}
.u{position:absolute;top:0;height:28px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);border-inline-end:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.t1 .u{font-weight:600;color:var(--ink);justify-content:flex-start;padding-inline-start:8px}
.tc{position:relative;flex:none}
.g-body{position:relative}
.overlay{position:absolute;top:0;bottom:0;right:var(--side);pointer-events:none;z-index:0}
.overlay .vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.overlay .vl.strong{background:var(--line)}
.overlay .we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.overlay .today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:4}
.overlay .today span{position:absolute;top:2px;right:4px;font-size:10.5px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 4px;border-radius:3px;white-space:nowrap}
.r:hover .side,.r:hover .tc{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.r:hover .tc{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.r.ph .side{background:var(--surface-2);font-weight:600}
.r.ph{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.wbs{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nm{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:right;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:100%;padding-block:0}
.nm .t{overflow:hidden;text-overflow:ellipsis}
.nm:hover .t{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.tag{flex:none;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--ok)} .dot.active{background:var(--accent)} .dot.late{background:var(--bad)}
.caret{flex:none;width:18px;height:18px;display:inline-grid;place-items:center;border-radius:4px;color:var(--muted);transition:transform .15s}
.collapsed .caret{transform:rotate(90deg)}
.swatch{flex:none;width:10px;height:10px;border-radius:2px;background:var(--c)}
.c-s,.c-d,.c-p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-p{font-weight:600;color:var(--ink)}
.bar{position:absolute;top:8px;height:18px;border-radius:4px;background:color-mix(in srgb,var(--c) 26%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);cursor:grab;z-index:1;touch-action:pan-y;overflow:hidden}
.bar:active{cursor:grabbing}
.bar .fill{position:absolute;inset-block:0;right:0;background:var(--c)}
.bar .h{position:absolute;left:0;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none}
.bar .h::after{content:"";position:absolute;left:2px;top:4px;bottom:4px;width:2px;border-radius:1px;background:color-mix(in srgb,var(--c) 70%,var(--ink))}
.bar.late{outline:2px dashed var(--bad);outline-offset:1px}
.bar.ms{width:16px!important;height:16px;top:9px;border-radius:2px;transform:rotate(45deg);background:var(--c);border-color:var(--c);overflow:visible;margin-right:-8px}
.sbar{position:absolute;top:13px;height:8px;background:color-mix(in srgb,var(--c) 45%,transparent);border-radius:2px;z-index:1}
.sbar i{position:absolute;inset-block:0;right:0;background:var(--c);border-radius:2px}
.bl{position:absolute;top:9px;font-size:11px;color:var(--muted);white-space:nowrap;z-index:1;pointer-events:none;font-variant-numeric:tabular-nums}
.addrow .side{color:var(--muted)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap}
@media (max-width:700px){
  :root{--side:186px}
  .side{grid-template-columns:34px minmax(0,1fr) 40px}
  .side .c-s,.side .c-d{display:none}
}

/* plan */
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.plan{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:17px}
.card .lead{margin:0;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.in,label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 9px;font-size:14px;color:var(--ink)}
textarea.in{resize:vertical;min-height:84px;line-height:1.7}
.ro{font-size:14px;color:var(--ink);padding-block:6px;font-variant-numeric:tabular-nums}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.phases li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding-block:12px;border-top:1px solid var(--line-soft)}
.phases li:first-child{border-top:0}
.phases .n{width:26px;height:26px;border-radius:6px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--font-display)}
.phases .hd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.phases .hd h3{font-size:15px}
.phases .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.phases .body{grid-column:2;display:flex;flex-direction:column;gap:6px}
.phases textarea.in{min-height:52px;font-size:13px}
.mini{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.mini i{position:absolute;inset-block:0;right:0;background:var(--c)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.t td.num{white-space:nowrap}
table.t .in{padding:4px 7px;font-size:13px}
table.t textarea.in{min-height:38px}
.risk{min-width:760px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(8,20,26,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog header{display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog h2{font-size:18px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.preds{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.preds label{display:flex;gap:8px;align-items:center;font-size:13px}
.preds .w{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
legend{font-size:12px;color:var(--muted);padding:0;margin-bottom:4px}
dialog footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog footer .grow{flex:1}
.note{font-size:12px;color:var(--warn)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* author block, current day, qty table */
.author{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:10px}
.author b{color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:14px}
.curday{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 10px;background:var(--surface)}
.curday input{width:64px;border:0;background:var(--surface-2);border-radius:4px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums}
table.t.qty{min-width:640px}
table.t.qty td.tot{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
table.t.qty .in.n{text-align:center;max-width:90px}
.u.wk{font-weight:600;color:var(--ink)}

/* PDF generation */
.pdf-veil{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;padding:16px}
.pdf-veil div{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:15px}
.pdf-veil .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pdf-host{position:fixed;top:0;left:0;z-index:150;display:flex;flex-direction:column;gap:20px;direction:rtl}
.pg{width:1123px;height:794px;background:#FFFFFF;color:#14232A;font-family:var(--font-body);font-size:12.5px;line-height:1.6;padding:26px 36px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pg-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2px solid #0A6C88;padding-bottom:8px}
.pg-h .co{font-family:var(--font-display);font-weight:700;font-size:16px;color:#0A6C88}
.pg-h .pr{font-size:11.5px;color:#4E5F67}
.pg-h .by{text-align:left;font-size:11.5px;color:#4E5F67}
.pg-h .by b{display:block;color:#14232A;font-size:13px}
.pg-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.pg-f{display:flex;justify-content:space-between;font-size:10.5px;color:#5A6B73;border-top:1px solid #D4DDE1;padding-top:5px}
.pg h1{font-family:var(--font-display);font-size:24px;margin:0;color:#14232A}
.pg h2{font-family:var(--font-display);font-size:15px;margin:0 0 6px;color:#0A6C88}
.pg p{margin:0}
.pg .txt{white-space:pre-line}
.pg .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;font-size:12px}
.pg .meta-grid span{color:#5A6B73}
.pg .meta-grid b{display:block;color:#14232A;font-weight:600}
.pg .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pg .kp div{border:1px solid #D4DDE1;border-radius:6px;padding:8px 12px}
.pg .kp span{display:block;font-size:11px;color:#5A6B73}
.pg .kp b{font-family:var(--font-display);font-size:19px;color:#14232A}
.pg table{width:100%;border-collapse:collapse;font-size:11.5px}
.pg th{background:#EAF0F2;color:#33454D;font-weight:600;text-align:right;padding:5px 7px;border:1px solid #D4DDE1}
.pg td{padding:4px 7px;border:1px solid #DFE6E9;vertical-align:top}
.pg td.c{text-align:center}
.pg .ph-list{display:flex;flex-direction:column;gap:6px}
.pg .ph-i{display:grid;grid-template-columns:24px 1fr;gap:2px 10px}
.pg .ph-i i{width:22px;height:22px;border-radius:5px;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.pg .ph-i b{font-size:13px}
.pg .ph-i small{color:#5A6B73;font-size:11px;margin-inline-start:8px}
.pg .ph-i p{grid-column:2;color:#33454D;font-size:11.5px}
.pg .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
.pg .sig div{border-top:1px solid #8A9AA2;padding-top:6px;font-size:12px;color:#5A6B73;min-height:60px}

.pgt{display:flex;flex-direction:column;border:1px solid #D4DDE1;position:relative}
.pgt .row{display:grid;height:19px;align-items:center;border-bottom:1px solid #EDF1F3;font-size:10.5px}

.pgt .row .c{text-align:center;font-variant-numeric:tabular-nums}

.pgt .row.ph{background:#F3F6F7;font-weight:700}
.pgt .ch{position:relative;height:100%;border-inline-start:1px solid #D4DDE1}
.pgt .ch .wl{position:absolute;top:0;bottom:0;width:1px;background:#E6ECEF}
.pgt .ch .wlab{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#33454D}

.pgt .ch .pl{position:absolute;top:2px;font-size:9.5px;color:#4E5F67;white-space:nowrap}
.pgt .ch .cd{position:absolute;top:0;bottom:0;width:2px;background:#BF3F2B}
.pg .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.5px;color:#4E5F67}
.pg .lg span{display:inline-flex;align-items:center;gap:5px}
.pg .lg i{width:10px;height:10px;border-radius:2px}

/* editable project parts */
.rows{display:flex;flex-direction:column;gap:6px}
.rowed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px;align-items:center}

.sub-h{font-size:14px;margin-top:4px}
.card h2+.pill{align-self:flex-start}
.proj{background:var(--accent-soft);border-color:transparent}
.sec-row{display:flex;flex-direction:column;gap:4px}

.projbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px}

/* ---------- gantt ---------- */
var G={d0:1,d1:71,ppd:15};
function units(kind){
  var out=[],d;
  if(kind==='day'){for(d=G.d0;d<G.d1;d++)out.push({s:d,e:d+1,l:String(d)});return out}
  if(kind==='week'){for(d=G.d0;d<G.d1;d+=7)out.push({s:d,e:Math.min(G.d1,d+7),l:(G.ppd*7>=70?'الأسبوع ':'')+wk(d)});return out}
  for(d=G.d0;d<G.d1;d+=28)out.push({s:d,e:Math.min(G.d1,d+28),l:'الأسابيع '+wk(d)+'–'+wk(Math.min(G.d1,d+28)-1)});return out;
}
function renderGantt(){
  var keepL=gEl.scrollLeft,keepT=gEl.scrollTop;
  G.ppd=ZOOM[ui.zoom].ppd;
  var mx=1;T().forEach(function(t){mx=Math.max(mx,fin(t))});
  G.d0=1;G.d1=Math.ceil((mx+6)/7)*7+1;
  var ppd=G.ppd,W=Math.round((G.d1-G.d0)*ppd);
  var x=function(d){return ((d-G.d0)*ppd).toFixed(1)};
  var tiers=ui.zoom==='compact'?['month','week']:['week','day'];
  var top=units(tiers[0]),bot=units(tiers[1]);
  var uh=function(list,cls){return list.map(function(u){return '<div class="u'+(cls||'')+'" style="right:'+x(u.s)+'px;width:'+((u.e-u.s)*ppd).toFixed(1)+'px">'+esc(u.l)+'</div>'}).join('')};
  var ov='';
  bot.forEach(function(u){ov+='<div class="vl" style="right:'+x(u.s)+'px"></div>'});
  top.forEach(function(u){ov+='<div class="vl strong" style="right:'+x(u.s)+'px"></div>'});
  var cd=cur();
  if(cd>0&&cd<G.d1)ov+='<div class="today" style="right:'+x(cd+1)+'px"><span>اليوم '+cd+'</span></div>';
  var wb=wbsMap(),rows='';
  state.phases.forEach(function(ph,pi){
    var vis=T().filter(function(t){return t.phase===ph.id&&stationOk(t)});
    if(ui.station!=='all'&&!vis.length)return;
    var col=phaseColor(pi),coll=!!ui.collapsed[ph.id],st=vis.length?stats(vis):null;
    var pe='<button class="btn sm" type="button" data-phase-edit="'+ph.id+'" style="pointer-events:auto;padding:0 6px;font-size:11px">تعديل المرحلة</button>';
    rows+='<div class="r ph'+(coll?' collapsed':'')+'" style="--c:'+col+'"><div class="side"><span class="wbs">'+(pi+1)+'</span>'+
      '<button class="nm" type="button" data-toggle="'+ph.id+'" aria-expanded="'+(!coll)+'"><span class="caret" aria-hidden="true">▾</span><span class="swatch"></span><span class="t">'+esc(ph.name)+'</span></button>'+
      '<span class="c-s">'+(st?'ي '+st.start:'')+'</span><span class="c-d">'+(st?(st.end-st.start+1)+' ي':'')+'</span><span class="c-p">'+(st?Math.round(st.actual)+'٪':'')+'</span></div>'+
      '<div class="tc" style="width:'+W+'px">'+(st?'<div class="sbar" style="right:'+x(st.start)+'px;width:'+((st.end-st.start+1)*ppd).toFixed(1)+'px"><i style="width:'+st.actual+'%"></i></div><span class="bl" style="right:'+(parseFloat(x(st.end+1))+6)+'px">'+pe+'</span>':'<span class="bl" style="right:8px">'+pe+'</span>')+'</div></div>';
    if(coll)return;
    vis.forEach(function(t){
      var stt=status(t),p=t.progress||0,s=t.start;
      var tag=t.station&&t.station!=='عام'?'<span class="tag">'+esc(t.station)+'</span>':'';
      rows+='<div class="r" style="--c:'+col+'"><div class="side"><span class="wbs">'+wb[t.id]+'</span>'+
       '<button class="nm" type="button" data-edit="'+t.id+'" title="'+esc(t.name)+' · '+STLBL[stt]+'"><span class="dot '+stt+'"></span><span class="t">'+esc(t.name)+'</span>'+tag+'</button>'+
       '<span class="c-s">ي '+s+'</span><span class="c-d">'+(t.ms?'معلم':t.dur+' ي')+'</span><span class="c-p">'+p+'٪</span></div><div class="tc" style="width:'+W+'px">';
      if(t.ms)rows+='<div class="bar ms'+(stt==='late'?' late':'')+'" data-id="'+t.id+'" style="right:'+x(s)+'px" title="'+esc(t.name)+'"></div><span class="bl" style="right:'+(parseFloat(x(s))+12)+'px">'+esc(t.name)+' · اليوم '+s+'</span>';
      else{var w=Math.max(4,t.dur*ppd);rows+='<div class="bar'+(stt==='late'?' late':'')+'" data-id="'+t.id+'" style="right:'+x(s)+'px;width:'+w.toFixed(1)+'px" title="'+esc(t.name)+'"><div class="fill" style="width:'+p+'%"></div><i class="h" aria-hidden="true"></i></div><span class="bl" style="right:'+(parseFloat(x(s))+w+6).toFixed(1)+'px">ي '+s+'–'+endDay(t)+' · '+p+'٪</span>'}
      rows+='</div></div>';
    });
    rows+='<div class="r addrow"><div class="side"><span></span><button class="nm" type="button" data-add="'+ph.id+'" style="font-size:12px;color:var(--muted)">+ إضافة مهمة إلى «'+esc(ph.name)+'»</button></div><div class="tc" style="width:'+W+'px"></div></div>';
  });
  gEl.innerHTML='<div class="g" style="width:calc(var(--side) + '+W+'px)"><div class="g-head"><div class="side"><span>رقم</span><span>المهمة</span><span class="c-s">البداية</span><span class="c-d">المدة</span><span>الإنجاز</span></div>'+
    '<div class="time-h" style="width:'+W+'px"><div class="tier t1">'+uh(top,' wk')+'</div><div class="tier t2">'+uh(bot)+'</div></div></div>'+
    '<div class="g-body"><div class="overlay" style="width:'+W+'px">'+ov+'</div>'+rows+'</div></div>';
  gEl.scrollLeft=keepL;gEl.scrollTop=keepT;
  $('#zoom').innerHTML=Object.keys(ZOOM).map(function(k){return '<button type="button" data-zoom="'+k+'" aria-pressed="'+(ui.zoom===k)+'">'+ZOOM[k].label+'</button>'}).join('');
  var opts=[['all','كل '+state.meta.stationsLabel],['عام','أعمال عامة']].concat(state.stations.map(function(s){return [s,s]}));
  $('#station-filter').innerHTML=opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(ui.station===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'}).join('');
  $('#legend').innerHTML=state.phases.map(function(ph,i){return '<span style="--c:'+phaseColor(i)+'"><i></i>'+esc(ph.name)+'</span>'}).join('')+

/* drag bars */
var drag=null,tipEl=null;
function tip(txt,e){if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl)}tipEl.hidden=!txt;tipEl.textContent=txt||'';if(e){tipEl.style.left=(e.clientX+12)+'px';tipEl.style.top=(e.clientY-30)+'px'}}
gEl.addEventListener('pointerdown',function(e){
  var bar=e.target.closest('.bar[data-id]');if(!bar||e.button>0)return;
  var t=byId()[bar.dataset.id];if(!t)return;
  drag={t:t,bar:bar,x0:e.clientX,s0:t.start,dur0:t.dur,resize:e.target.classList.contains('h'),moved:false,dd:0};
  ls(function(){bar.setPointerCapture(e.pointerId)});
});
gEl.addEventListener('pointermove',function(e){
  if(!drag)return;var dx=e.clientX-drag.x0;if(Math.abs(dx)>4)drag.moved=true;if(!drag.moved)return;
  e.preventDefault();var dd=Math.round(-dx/G.ppd);
  if(drag.resize){var nd=Math.max(1,drag.dur0+dd);drag.dd=nd-drag.dur0;drag.bar.style.width=(nd*G.ppd)+'px';tip(nd+' يوم · تنتهي '+dayTxt(drag.s0+nd-1),e)}
  else{var ns=Math.max(1,drag.s0+dd);drag.dd=ns-drag.s0;drag.bar.style.right=((ns-G.d0)*G.ppd)+'px';tip('تبدأ '+dayTxt(ns),e)}
});
function endDrag(cancel){
  if(!drag)return;var d=drag;drag=null;tip('');
  if(cancel){renderGantt();return}
  if(!d.moved){openTask(d.t.id);return}
  if(!d.dd){renderGantt();return}
  var want=d.s0+d.dd;

function importProjects(f){
  var rd=new FileReader();
  rd.onload=function(){var o=ls(function(){return JSON.parse(rd.result)});
    var list=o&&Array.isArray(o.projects)?o.projects:(o&&Array.isArray(o.tasks)&&Array.isArray(o.phases)?[o]:null);
    list=list&&list.filter(function(p){return p&&Array.isArray(p.tasks)&&Array.isArray(p.phases)});
    if(!list||!list.length){toast('الملف ليس ملف مشروع صالحاً.');return}
    snap();var first=null;list.forEach(function(p){p=normalize(p);delete p.rev;p.id=nid('P');root.projects.push(p);if(!first)first=p.id});
    dirty=true;saveDraft();
    if(list.length>1){renderAll();toast('أُضيف '+list.length+' مشاريع من الملف.')}
    else{switchTo(first);toast('أُضيف المشروع «'+(state.meta.project||'')+'». احفظ التعديلات للجميع لاعتماده.')}};
  rd.onerror=function(){toast('تعذّرت قراءة الملف.')};rd.readAsText(f);
}

  flow(el('div','kp','<div><span>مدة التنفيذ المخططة</span><b>'+dur+' يوم</b> <span>'+wk(dur)+' أسبوع</span></div><div><span>عدد المهام</span><b>'+T().length+'</b></div><div><span>الإنجاز الفعلي / المخطط</span><b>'+s.actual.toFixed(1)+'٪ / '+s.planned.toFixed(1)+'٪</b></div><div><span>نهاية الأعمال المتوقعة</span><b>اليوم '+s.end+'</b> <span>الأسبوع '+wk(s.end)+'</span></div>'));
  var ct=contract();
  if(shown('contract'))flow(el('div','kp','<div><span>تاريخ استلام الموقع</span><b style="font-size:15px">'+(ct?esc(fd(ct.r)):'—')+'</b></div><div><span>المدة المنقضية منذ الاستلام</span><b>'+(ct?ct.elapsed+' يوم':'—')+'</b> <span>'+(ct?'حتى '+esc(fd(ct.today)):'')+'</span></div><div><span>تاريخ التسليم التعاقدي</span><b style="font-size:15px">'+(ct?esc(fd(ct.due)):'—')+'</b> <span>'+(ct?ct.cd+' يوم':'')+'</span></div><div'+(ct&&ct.delay>0?' style="border-color:#BF3F2B"':'')+'><span>أيام التأخير عن التسليم</span><b'+(ct&&ct.delay>0?' style="color:#BF3F2B"':'')+'>'+(ct?ct.delay+' يوم':'—')+'</b> <span>'+(ct?'المتوقع عند الانتهاء: '+ct.expDelay+' يوم':'')+'</span></div>'));
  if(shown('scope')&&m.scope.trim())flow(el('div','','<h2>'+L('scope')+'</h2><p class="txt">'+esc(m.scope)+'</p>'));
  if(shown('qty')&&state.qty.length)flowTable(L('qty'),'<tr><th style="width:30px">م</th><th>البند</th><th style="width:80px">الوحدة</th>'+state.stations.map(function(x){return '<th style="width:90px">'+esc(x)+'</th>'}).join('')+'<th style="width:70px">الإجمالي</th></tr>',
    state.qty.map(function(r,i){return '<tr><td class="c">'+(i+1)+'</td><td>'+esc(r.item)+'</td><td class="c">'+esc(r.unit)+'</td>'+state.stations.map(function(_,k){return '<td class="c">'+esc(r.q[k]||'—')+'</td>'}).join('')+'<td class="c"><b>'+qtyTotal(r)+'</b></td></tr>'}));
  if(shown('phases'))flow(el('div','','<h2>'+L('phases')+'</h2><div class="ph-list">'+state.phases.map(function(ph,i){var ts=T().filter(function(t){return t.phase===ph.id}),st=ts.length?stats(ts):null;
    return '<div class="ph-i"><i style="background:'+PCOL[i%8]+'">'+(i+1)+'</i><div><b>'+esc(ph.name)+'</b>'+(st?'<small>اليوم '+st.start+' – '+st.end+' · '+(st.end-st.start+1)+' يوم · '+ts.length+' مهمة</small>':'')+'</div><p>'+esc(ph.desc)+'</p></div>'}).join('')+'</div>'));
  if(shown('milestones'))flowTable(L('milestones'),'<tr><th>المعلم</th><th style="width:150px">اليوم</th><th style="width:90px">الحالة</th></tr>',milestones().map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="c">اليوم '+x.d+' · الأسبوع '+wk(x.d)+'</td><td class="c">'+STLBL[x.st]+'</td></tr>'}));
  if(shown('method')&&m.method.trim())flow(el('div','','<h2>'+L('method')+'</h2><p class="txt">'+esc(m.method)+'</p>'));

  /* gantt pages */
  var inner=1123-72,cols=[34,350,74,40,40,40],fixed=cols.reduce(function(a,b){return a+b},0),CW=inner-fixed-2;
  var mx=1;T().forEach(function(t){mx=Math.max(mx,fin(t))});
  var span=Math.ceil((mx-1+2)/7)*7,ppd=CW/span,X=function(d){return ((d-1)*ppd).toFixed(1)};
  var tmpl='grid-template-columns:'+cols.map(function(c){return c+'px'}).join(' ')+' '+CW+'px';
  var weeks='',lines='';for(var w=0;w*7<span;w++){var wpx=7*ppd;weeks+='<span class="wlab" style="right:'+X(w*7+1)+'px;width:'+wpx.toFixed(1)+'px">'+(wpx>=34?'أ'+(w+1):(w+1))+'</span>';lines+='<span class="wl" style="right:'+X(w*7+1)+'px"></span>'}
  var cd=cur(),cdl=cd>0&&cd<=span?'<span class="cd" style="right:'+X(cd+1)+'px"></span>':'';
  var grows=[];
  state.phases.forEach(function(ph,pi){
    var ts=T().filter(function(t){return t.phase===ph.id});if(!ts.length)return;var st=stats(ts),c=PCOL[pi%8];
    grows.push('<div class="row ph" style="'+tmpl+'"><span class="c">'+(pi+1)+'</span><span>'+esc(ph.name)+'</span><span></span><span class="c">'+st.start+'</span><span class="c">'+st.end+'</span><span class="c">'+(st.end-st.start+1)+'</span><span class="ch">'+lines+cdl+'<span class="ps" style="right:'+X(st.start)+'px;width:'+((st.end-st.start+1)*ppd).toFixed(1)+'px;background:'+c+'"></span></span></div>');
    ts.forEach(function(t){
      var xm=parseFloat(X(t.start)),bar=t.ms?'<span class="pm" style="right:'+xm+'px;background:'+c+'"></span><span class="pl" style="'+(xm>CW*0.55?'left:'+(CW-xm+9).toFixed(1):'right:'+(xm+9))+'px">'+esc(t.name)+'</span>'
        :'<span class="pb" style="right:'+X(t.start)+'px;width:'+Math.max(3,t.dur*ppd).toFixed(1)+'px;background:'+c+'40;border:1px solid '+c+'"><i style="width:'+(t.progress||0)+'%;background:'+c+'"></i></span>'+((t.progress||0)>0?'<span class="pl" style="right:'+(parseFloat(X(t.start))+t.dur*ppd+4).toFixed(1)+'px">'+t.progress+'٪</span>':'');
      grows.push('<div class="row" style="'+tmpl+'"><span class="c">'+wb[t.id]+'</span><span>'+esc(clip(t.name))+'</span><span>'+(t.station==='عام'?'—':esc(t.station))+'</span><span class="c">'+t.start+'</span><span class="c">'+endDay(t)+'</span><span class="c">'+(t.ms?'—':t.dur)+'</span><span class="ch">'+lines+cdl+bar+'</span></div>');
    });
  });
  var head='<div class="row hd" style="'+tmpl+'"><span class="c">رقم</span><span>المهمة</span><span>'+SL()+'</span><span class="c">من يوم</span><span class="c">إلى يوم</span><span class="c">المدة</span><span class="ch">'+lines+weeks+'</span></div>';
  var legend='<div class="lg">'+state.phases.map(function(ph,i){return '<span><i style="background:'+PCOL[i%8]+'"></i>'+esc(ph.name)+'</span>'}).join('')+(cdl?'<span><i style="background:#BF3F2B;width:3px"></i>يوم المشروع الحالي ('+cd+')</span>':'')+'<span>المقياس: أ = أسبوع، والأيام من بداية الأعمال</span></div>';
  var gi=0,first=true;
  while(shown('schedule')&&gi<grows.length){
    body=page();
    var hdr=el('div','','<h2>'+L('schedule')+(first?'':' (تابع)')+'</h2>');body.appendChild(hdr);
    var tbl=el('div','pgt',head);body.appendChild(tbl);var lg=el('div','',legend);body.appendChild(lg);
    var added=0;
    while(gi<grows.length){var r=el('div','',grows[gi]).firstChild;tbl.appendChild(r);if(over(body)&&added>0){tbl.removeChild(r);break}gi++;added++}
    first=false;
  }
  if(shown('schedule')&&grows.length)body=page();
  if(shown('risks')&&state.risks.length)flowTable(L('risks'),'<tr><th>الخطر</th><th style="width:80px">الاحتمالية</th><th style="width:70px">الأثر</th><th>الإجراء الوقائي</th></tr>',state.risks.map(function(r){return '<tr><td>'+esc(r.risk)+'</td><td class="c">'+esc(r.prob)+'</td><td class="c">'+esc(r.impact)+'</td><td>'+esc(r.mitigation)+'</td></tr>'}));
  if(shown('hse')&&m.hse.trim())flow(el('div','','<h2>'+L('hse')+'</h2><p class="txt">'+esc(m.hse)+'</p>'));
  if(shown('governance')&&m.governance.trim())flow(el('div','','<h2>'+L('governance')+'</h2><p class="txt">'+esc(m.governance)+'</p>'));
  if(m.signs.length){var sg=el('div','sig',m.signs.map(function(x){return '<div>'+esc(x.role)+'<b>'+(esc(x.name)||'&nbsp;')+'</b>'+esc(x.org)+'</div>'}).join(''));sg.style.gridTemplateColumns='repeat('+m.signs.length+',1fr)';flow(sg)}
  pages.forEach(function(p,i){p.querySelector('.pn').textContent='صفحة '+(i+1)+' من '+pages.length});
  return pages;
}
function exportPdf(){
  if(busy)return;
  if(dlKnown&&!dl&&HOST){toast('تحميل الملفات غير متاح في هذا العرض.');return}
  busy=true;
  var veil=el('div','pdf-veil','<div><span class="spin"></span><b>جارٍ تجهيز ملف PDF…</b><span id="pdf-prog" class="num"></span></div>');
  var host=el('div','pdf-host');
  document.body.appendChild(host);document.body.appendChild(veil);
  var pages,doc,sx=window.scrollX,sy=window.scrollY;
  var fontsReady=document.fonts&&document.fonts.ready?Promise.all([document.fonts.ready,document.fonts.load('400 13px "IBM Plex Sans Arabic"'),document.fonts.load('700 13px "IBM Plex Sans Arabic"'),document.fonts.load('600 16px "Readex Pro"')]).catch(function(){}):Promise.resolve();
  libs().then(function(){return fontsReady}).then(function(){
    pages=buildPdfPages(host);
    doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
    var i=0;
    function next(){
      if(i>=pages.length)return Promise.resolve();
      $('#pdf-prog').textContent='صفحة '+(i+1)+' من '+pages.length;
      return window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:-window.scrollY,windowWidth:1200}).then(function(cv){
        if(i>0)doc.addPage('a4','landscape');
        doc.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,297,210,undefined,'FAST');
        i++;return next();
      });
    }
    return next();
  }).then(function(){
    host.remove();veil.remove();busy=false;
    return offerFile(fname('pdf'),doc.output('blob'),'جُهّز ملف PDF');
  }).catch(function(){
    host.remove();veil.remove();busy=false;toast('تعذّر إنشاء ملف PDF. تحقق من الاتصال وحاول مرة أخرى.');
  });
}

/* ---------- boot ---------- */
function renderAll(){renderView();renderHome();renderProjects();renderHeader();renderBanners();renderContract();renderKpis();renderTabs();renderGantt();renderPlan();renderSave();schedulePreview()}
var pvT;
function schedulePreview(ms){if(ui.tab!=='pdf'||ui.view==='home')return;clearTimeout(pvT);pvT=setTimeout(renderPreview,ms==null?250:ms)}
function renderPreview(){
  var box=$('#pdf-preview');if(!box||ui.tab!=='pdf'||busy)return;
  var meas=el('div','pdf-host');meas.style.visibility='hidden';meas.style.zIndex='-1';document.body.appendChild(meas);
  var pages=buildPdfPages(meas),sc=Math.min(1,(box.clientWidth||1123)/1123),frag=document.createDocumentFragment();
  pages.forEach(function(p){var w=el('div','pv');w.style.width=(1123*sc)+'px';w.style.height=(794*sc)+'px';p.style.transform='scale('+sc+')';w.appendChild(p);frag.appendChild(w)});
  box.innerHTML='';box.appendChild(frag);meas.remove();
}
window.addEventListener('resize',function(){schedulePreview()});
schedule();
renderAll();
if(HOST){
  HOST.use('artifact').then(function(a){art=a;artKnown=true;renderSave()},function(){artKnown=true;renderSave()});
  HOST.use('downloads').then(function(d){dl=d;dlKnown=true;renderSave()},function(){dlKnown=true;renderSave()});
}else{artKnown=true;dlKnown=true;renderSave()}
})();
