<title>محطات رفع حفر الباطن</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap"><style id="app-css">
/* Layout: a field-office sheet. Header + KPI strip, then two tabs: an RTL Gantt (sticky task list on the right, time flowing right-to-left) and an editable work plan. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#E9EFF1; --ink:#0F2129; --muted:#5A6B73; --line:#D4DDE1; --line-soft:#E6ECEF;
  --accent:#0A6C88; --accent-ink:#FFFFFF; --accent-soft:#DCEDF2;
  --ok:#2C7A4D; --ok-soft:#E0F0E6; --warn:#A86E12; --warn-soft:#F9EDD6; --bad:#BF3F2B; --bad-soft:#FAE2DD;
  --c1:#3D6F9E; --c2:#7357A6; --c3:#A87512; --c4:#8A6648; --c5:#12837F; --c6:#B0466A; --c7:#4A8636; --c8:#56636E;
  --weekend:rgba(10,108,136,.045);
  --font-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --side:452px; --row:34px; --radius:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1519; --surface:#142027; --surface-2:#1A2830; --ink:#E2EBEE; --muted:#93A5AD; --line:#2A3A42; --line-soft:#1F2D34;
  --accent:#4FB2CE; --accent-ink:#06222B; --accent-soft:#16343F;
  --ok:#5FC08A; --ok-soft:#163327; --warn:#E0A640; --warn-soft:#3A2D14; --bad:#EF7A66; --bad-soft:#3D1E19;
  --c1:#6E9DCB; --c2:#A48AD6; --c3:#D9A443; --c4:#BC9878; --c5:#48B8B2; --c6:#DD7A9C; --c7:#7DBC67; --c8:#8C9AA6;
  --weekend:rgba(79,178,206,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1519; --surface:#142027; --surface-2:#1A2830; --ink:#E2EBEE; --muted:#93A5AD; --line:#2A3A42; --line-soft:#1F2D34;
  --accent:#4FB2CE; --accent-ink:#06222B; --accent-soft:#16343F;
  --ok:#5FC08A; --ok-soft:#163327; --warn:#E0A640; --warn-soft:#3A2D14; --bad:#EF7A66; --bad-soft:#3D1E19;
  --c1:#6E9DCB; --c2:#A48AD6; --c3:#D9A443; --c4:#BC9878; --c5:#48B8B2; --c6:#DD7A9C; --c7:#7DBC67; --c8:#8C9AA6;
  --weekend:rgba(79,178,206,.06); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;direction:rtl}
#app{max-width:1440px;margin-inline:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){#app{padding:14px 16px 32px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;font-weight:600}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--accent);font-weight:600}
.top h1{font-size:clamp(22px,3.2vw,30px);line-height:1.25}
.sub{color:var(--muted);font-size:13px}
.savebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--accent-soft);border-radius:var(--radius);padding:10px 14px;font-size:13px}
.banner.warn{background:var(--warn-soft)}
.banner p{margin:0;flex:1 1 280px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.dual{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.dual i{position:absolute;inset-block:0;right:0;border-radius:4px}
.dual .pl{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.dual .ac{background:var(--accent);inset-block:2px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:600;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)}

/* tabs + toolbar */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
select.btn{padding-inline-end:28px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}

/* gantt */
.gantt{position:relative;overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overscroll-behavior:contain}
.g{position:relative}
.g-head{position:sticky;top:0;z-index:5;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.r{display:flex;height:var(--row);border-bottom:1px solid var(--line-soft)}
.side{position:sticky;right:0;z-index:3;flex:0 0 var(--side);width:var(--side);background:var(--surface);display:grid;grid-template-columns:44px minmax(0,1fr) 70px 50px 48px;align-items:center;border-inline-end:1px solid var(--line);font-size:13px}
.side>*{padding-inline:6px;min-width:0}
.g-head .side{z-index:6;height:56px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.time-h{position:relative;height:56px;flex:none}
.tier{position:absolute;inset-inline:0;height:28px}
.tier.t1{top:0;border-bottom:1px solid var(--line-soft)} .tier.t2{top:28px}
.u{position:absolute;top:0;height:28px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);border-inline-end:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.t1 .u{font-weight:600;color:var(--ink);justify-content:flex-start;padding-inline-start:8px}
.tc{position:relative;flex:none}
.g-body{position:relative}
.overlay{position:absolute;top:0;bottom:0;right:var(--side);pointer-events:none;z-index:0}
.overlay .vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.overlay .vl.strong{background:var(--line)}
.overlay .we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.overlay .today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:4}
.overlay .today span{position:absolute;top:2px;right:4px;font-size:10.5px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 4px;border-radius:3px;white-space:nowrap}
.r:hover .side,.r:hover .tc{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.r:hover .tc{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.r.ph .side{background:var(--surface-2);font-weight:600}
.r.ph{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.wbs{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nm{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:right;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:100%;padding-block:0}
.nm .t{overflow:hidden;text-overflow:ellipsis}
.nm:hover .t{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.tag{flex:none;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--ok)} .dot.active{background:var(--accent)} .dot.late{background:var(--bad)}
.caret{flex:none;width:18px;height:18px;display:inline-grid;place-items:center;border-radius:4px;color:var(--muted);transition:transform .15s}
.collapsed .caret{transform:rotate(90deg)}
.swatch{flex:none;width:10px;height:10px;border-radius:2px;background:var(--c)}
.c-s,.c-d,.c-p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-p{font-weight:600;color:var(--ink)}
.bar{position:absolute;top:8px;height:18px;border-radius:4px;background:color-mix(in srgb,var(--c) 26%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);cursor:grab;z-index:1;touch-action:pan-y;overflow:hidden}
.bar:active{cursor:grabbing}
.bar .fill{position:absolute;inset-block:0;right:0;background:var(--c)}
.bar .h{position:absolute;left:0;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none}
.bar .h::after{content:"";position:absolute;left:2px;top:4px;bottom:4px;width:2px;border-radius:1px;background:color-mix(in srgb,var(--c) 70%,var(--ink))}
.bar.late{outline:2px dashed var(--bad);outline-offset:1px}
.bar.ms{width:16px!important;height:16px;top:9px;border-radius:2px;transform:rotate(45deg);background:var(--c);border-color:var(--c);overflow:visible;margin-right:-8px}
.sbar{position:absolute;top:13px;height:8px;background:color-mix(in srgb,var(--c) 45%,transparent);border-radius:2px;z-index:1}
.sbar i{position:absolute;inset-block:0;right:0;background:var(--c);border-radius:2px}
.bl{position:absolute;top:9px;font-size:11px;color:var(--muted);white-space:nowrap;z-index:1;pointer-events:none;font-variant-numeric:tabular-nums}
.addrow .side{color:var(--muted)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap}
@media (max-width:700px){
  :root{--side:186px}
  .side{grid-template-columns:34px minmax(0,1fr) 40px}
  .side .c-s,.side .c-d{display:none}
}

/* plan */
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.plan{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:17px}
.card .lead{margin:0;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.in,label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 9px;font-size:14px;color:var(--ink)}
textarea.in{resize:vertical;min-height:84px;line-height:1.7}
.ro{font-size:14px;color:var(--ink);padding-block:6px;font-variant-numeric:tabular-nums}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.phases li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding-block:12px;border-top:1px solid var(--line-soft)}
.phases li:first-child{border-top:0}
.phases .n{width:26px;height:26px;border-radius:6px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--font-display)}
.phases .hd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.phases .hd h3{font-size:15px}
.phases .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.phases .body{grid-column:2;display:flex;flex-direction:column;gap:6px}
.phases textarea.in{min-height:52px;font-size:13px}
.mini{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.mini i{position:absolute;inset-block:0;right:0;background:var(--c)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.t td.num{white-space:nowrap}
table.t .in{padding:4px 7px;font-size:13px}
table.t textarea.in{min-height:38px}
.risk{min-width:760px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(8,20,26,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog header{display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog h2{font-size:18px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.preds{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.preds label{display:flex;gap:8px;align-items:center;font-size:13px}
.preds .w{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
legend{font-size:12px;color:var(--muted);padding:0;margin-bottom:4px}
dialog footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog footer .grow{flex:1}
.note{font-size:12px;color:var(--warn)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100vw - 32px)}

var G={d0:0,d1:0,ppd:6};
function monthStart(n,off){var d=new Date(n*DAY);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+(off||0),1)/DAY}
function units(kind,a,b){
  var out=[],cur,step;
  if(kind==='day'){for(cur=a;cur<b;cur++)out.push({s:cur,e:cur+1,l:String(new Date(cur*DAY).getUTCDate())});return out}
  if(kind==='week'){cur=a;while(new Date(cur*DAY).getUTCDay()!==0)cur++;if(cur>a)out.push({s:a,e:cur,l:''});for(;cur<b;cur+=7)out.push({s:cur,e:Math.min(b,cur+7),l:String(new Date(cur*DAY).getUTCDate())});return out}
  step=kind==='month'?1:kind==='quarter'?3:12;
  var d=new Date(a*DAY),y=d.getUTCFullYear(),m=d.getUTCMonth();
  if(kind==='quarter')m=m-m%3; if(kind==='year')m=0;
  while(true){
    var s=Date.UTC(y,m,1)/DAY;if(s>=b)break;var e=Date.UTC(y,m+step,1)/DAY;
    var l=kind==='month'?fM.format(new Date(s*DAY)):kind==='quarter'?'الربع '+(Math.floor(m/3)+1):String(y);
    if(kind==='month'&&G.ppd*30>120)l=fMY.format(new Date(s*DAY));
    out.push({s:Math.max(s,a),e:Math.min(e,b),l:l});
    m+=step;while(m>11){m-=12;y++}
  }
  return out;
}

  G.d0=monthStart(a-7);G.d1=monthStart(b+14,1);

var drag=null,tipEl=null;
function tip(txt,e){if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl)}tipEl.hidden=!txt;tipEl.textContent=txt||'';if(e){tipEl.style.left=(e.clientX+12)+'px';tipEl.style.top=(e.clientY-30)+'px'}}

  var bar=e.target.closest('.bar[data-id]');if(!bar||e.button>0)return;

  drag={t:t,bar:bar,x0:e.clientX,s0:sDay(t),dur0:t.dur,resize:e.target.classList.contains('h'),moved:false,dd:0,pid:e.pointerId};

  if(!drag)return;var dx=e.clientX-drag.x0;if(Math.abs(dx)>4)drag.moved=true;if(!drag.moved)return;

  var dd=Math.round(-dx/G.ppd);drag.dd=dd;

  if(!drag)return;var d=drag;drag=null;tip('');

    e.preventDefault();
    var name=$('#f-name').value.trim();if(!name){$('#f-name').focus();return}
    var vals={name:name,phase:$('#f-phase').value,station:$('#f-station').value,ms:fms.checked,start:fs.value||t.start,dur:fms.checked?0:Math.max(1,parseInt(fdur.value,10)||1),progress:+$('#f-prog').value,owner:$('#f-owner').value.trim(),notes:$('#f-notes').value,preds:$$('.preds input:checked',f).map(function(i){return i.value})};
    closeDlg();
    mutate(function(){
      if(isNew){var o=Object.assign({},t,vals);if(!o.ms)delete o.ms;state.tasks.push(o)}
      else{var x=byId()[t.id];Object.assign(x,vals);if(!x.ms)delete x.ms}
    });
    var after=byId()[t.id];if(after&&after.start!==vals.start)toast('رُحّلت البداية إلى '+fd(sDay(after))+' بسبب المهام السابقة');
    else toast(isNew?'أُضيفت المهمة':'حُفظت التعديلات');
  });
  openDlg();setTimeout(function(){var n=$('#f-name');if(n&&isNew)n.focus()},30);
}
function openPhase(id){
  var isNew=!id,ph=isNew?{id:uid('p'),name:'',desc:''}:state.phases.filter(function(p){return p.id===id})[0];if(!ph)return;
  var count=T().filter(function(t){return t.phase===ph.id}).length,idx=phaseIndex(ph.id);
  dlg.innerHTML='<form id="phase-form"><header><h2>'+(isNew?'مرحلة جديدة':'تعديل المرحلة')+'</h2><button type="button" class="x" data-close aria-label="إغلاق">×</button></header>'+
   '<label class="f">اسم المرحلة<input id="p-name" required value="'+esc(ph.name)+'"></label>'+
   '<label class="f">وصف المرحلة<textarea id="p-desc" rows="3">'+esc(ph.desc)+'</textarea></label>'+
   (isNew?'':'<div class="toolbar"><button type="button" class="btn sm" id="p-up"'+(idx===0?' disabled':'')+'>نقل لأعلى</button><button type="button" class="btn sm" id="p-down"'+(idx===state.phases.length-1?' disabled':'')+'>نقل لأسفل</button></div>')+
   '<footer>'+(isNew?'':'<button type="button" class="btn danger" id="p-del">'+(count?'حذف المرحلة و'+count+' مهمة':'حذف المرحلة')+'</button>')+'<span class="grow"></span><button type="button" class="btn" data-close>إلغاء</button><button type="submit" class="btn primary">'+(isNew?'إضافة':'حفظ')+'</button></footer></form>';
  var f=$('#phase-form');
  function move(dir){closeDlg();mutate(function(){var a=state.phases,i=phaseIndex(ph.id),j=i+dir;var tmp=a[i];a[i]=a[j];a[j]=tmp})}
  if(!isNew){$('#p-up').addEventListener('click',function(){move(-1)});$('#p-down').addEventListener('click',function(){move(1)});
    var del=$('#p-del');del.addEventListener('click',function(){
      if(del.dataset.armed){closeDlg();mutate(function(){var gone={};T().forEach(function(t){if(t.phase===ph.id)gone[t.id]=1});state.phases=state.phases.filter(function(p){return p.id!==ph.id});state.tasks=T().filter(function(t){return !gone[t.id]});T().forEach(function(t){t.preds=t.preds.filter(function(p){return !gone[p]})})});toast('حُذفت المرحلة · يمكنك التراجع');return}
      del.dataset.armed='1';del.textContent='اضغط مرة أخرى للتأكيد';});}
  f.addEventListener('submit',function(e){e.preventDefault();var n=$('#p-name').value.trim();if(!n){$('#p-name').focus();return}var d=$('#p-desc').value;closeDlg();
    mutate(function(){if(isNew)state.phases.push({id:ph.id,name:n,desc:d});else{var p=state.phases[phaseIndex(ph.id)];p.name=n;p.desc=d}});});
  openDlg();
}

/* ---------- plan tab ---------- */
function renderPlan(){
  var m=state.meta,s=stats(),wb=wbsMap();
  var phases=state.phases.map(function(ph,i){
    var ts=T().filter(function(t){return t.phase===ph.id}),st=ts.length?stats(ts):null;
    return '<li style="--c:'+phaseColor(i)+'"><span class="n">'+(i+1)+'</span><div class="hd"><h3>'+esc(ph.name)+'</h3>'+
      (st?'<span class="meta">'+esc(fd(st.start))+' – '+esc(fd(st.end))+' · '+(st.end-st.start+1)+' يوم · '+ts.length+' مهمة · '+Math.round(st.actual)+'٪</span>':'<span class="meta">لا توجد مهام بعد</span>')+'</div>'+
      '<div class="body">'+(st?'<div class="mini"><i style="width:'+st.actual+'%"></i></div>':'')+'<textarea class="in" data-bind="phase:'+ph.id+':desc" id="pd-'+ph.id+'" aria-label="وصف '+esc(ph.name)+'">'+esc(ph.desc)+'</textarea></div></li>';
  }).join('');
  var ms=T().filter(function(t){return t.ms}).map(function(t){return {name:t.name,d:sDay(t),st:status(t),id:t.id}});
  state.phases.forEach(function(ph){var ts=T().filter(function(t){return t.phase===ph.id&&!t.ms});if(ts.length){var st=stats(ts);ms.push({name:'اكتمال '+ph.name,d:st.end,st:st.actual>=100?'done':TODAY>st.end?'late':'planned'})}});
  ms.sort(function(a,b){return a.d-b.d});
  var stPill={done:'ok',late:'bad',active:'warn',planned:'n'};
  var risks=state.risks.map(function(r){
    var sel=function(field,list){return '<select class="in" data-bind="risk:'+r.id+':'+field+'" id="r-'+field+'-'+r.id+'">'+list.map(function(v){return '<option'+(v===r[field]?' selected':'')+'>'+v+'</option>'}).join('')+'</select>'};
    return '<tr><td><textarea class="in" rows="2" data-bind="risk:'+r.id+':risk" id="r-risk-'+r.id+'">'+esc(r.risk)+'</textarea></td><td style="width:110px">'+sel('prob',LEVELS)+'</td><td style="width:110px">'+sel('impact',IMPACTS)+'</td><td><textarea class="in" rows="2" data-bind="risk:'+r.id+':mitigation" id="r-mit-'+r.id+'">'+esc(r.mitigation)+'</textarea></td><td style="width:44px"><button class="btn sm danger" type="button" data-del-risk="'+r.id+'" aria-label="حذف الخطر">×</button></td></tr>';
  }).join('');
  var fld=function(label,key,type){return '<label class="f">'+label+'<input class="in" '+(type?'type="'+type+'" ':'')+'id="m-'+key+'" data-bind="meta.'+key+'" value="'+esc(m[key])+'"></label>'};
  $('#panel-plan').innerHTML='<div class="plan">'+
   '<section class="card wide"><h2>بطاقة المشروع</h2><div class="fields">'+
    fld('اسم المشروع','name')+fld('الجهة المالكة','client')+fld('المقاول','contractor')+fld('الاستشاري','consultant')+fld('الموقع','location')+
    '<label class="f">تاريخ بدء المشروع (يُزيح كل المهام)<input class="in" type="date" id="m-start" data-start value="'+esc(m.start)+'"></label>'+
    '<label class="f">المحطات (افصل بينها بفاصلة)<input class="in" id="m-stations" data-stations value="'+esc(m.stations.join('، '))+'"></label>'+
    '<div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)">النهاية المتوقعة<span class="ro">'+esc(fd(s.end))+' · '+(s.end-s.start+1)+' يوم</span></div>'+
   '</div></section>'+
   '<section class="card wide"><h2>الهدف ونطاق العمل</h2><textarea class="in" id="m-scope" data-bind="meta.scope" rows="4">'+esc(m.scope)+'</textarea></section>'+
   '<section class="card"><h2>مراحل التنفيذ</h2><p class="lead">التواريخ والنسب محسوبة من الجدول الزمني. الوصف قابل للتعديل.</p><ol class="phases">'+phases+'</ol><div><button class="btn sm" type="button" data-act="add-phase">+ مرحلة جديدة</button></div></section>'+
   '<div style="display:flex;flex-direction:column;gap:16px;min-width:0">'+
   '<section class="card"><h2>المعالم الرئيسية</h2><div class="tw"><table class="t"><thead><tr><th>المعلم</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>'+
     ms.map(function(x){return '<tr><td>'+(x.id?'<button class="nm" type="button" data-edit="'+x.id+'" style="padding:0;height:auto;white-space:normal"><span class="t">'+esc(x.name)+'</span></button>':esc(x.name))+'</td><td class="num">'+esc(fd(x.d))+'</td><td><span class="pill '+stPill[x.st]+'">'+STLBL[x.st]+'</span></td></tr>'}).join('')+
   '</tbody></table></div></section>'+
   '<section class="card"><h2>آلية المتابعة والتقارير</h2><textarea class="in" id="m-governance" data-bind="meta.governance" rows="5">'+esc(m.governance)+'</textarea></section></div>'+
   '<section class="card wide"><h2>سجل المخاطر</h2><div class="tw"><table class="t risk"><thead><tr><th>الخطر</th><th>الاحتمالية</th><th>الأثر</th><th>الإجراء الوقائي</th><th></th></tr></thead><tbody>'+risks+'</tbody></table></div><div><button class="btn sm" type="button" data-act="add-risk">+ خطر جديد</button></div></section>'+
  '</div>';
}
var plan=$('#panel-plan'),focusSnap=false;
plan.addEventListener('focusin',function(e){if(e.target.dataset&&e.target.dataset.bind&&!focusSnap){snap();focusSnap=true}});
plan.addEventListener('focusout',function(){focusSnap=false});
function bindSet(el){
  var p=el.dataset.bind,v=el.value,parts;
  if(p.indexOf('meta.')===0)state.meta[p.slice(5)]=v;
  else if((parts=p.split(':'))[0]==='phase'){var ph=state.phases[phaseIndex(parts[1])];if(ph)ph[parts[2]]=v}
  else if(parts[0]==='risk'){state.risks.forEach(function(r){if(r.id===parts[1])r[parts[2]]=v})}
  dirty=true;saveDraft();renderSave();
  if(p==='meta.name'||p==='meta.location'||p==='meta.client'||p==='meta.contractor')renderHeader();
}
plan.addEventListener('input',function(e){if(e.target.dataset.bind)bindSet(e.target)});
plan.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.bind&&el.tagName==='SELECT'){bindSet(el);return}
  if(el.hasAttribute('data-start')&&el.value){var delta=dnum(el.value)-dnum(state.meta.start);if(!delta)return;mutate(function(){state.meta.start=el.value;T().forEach(function(t){t.start=diso(sDay(t)+delta)})});toast('أُزيحت كل المهام '+Math.abs(delta)+' يوماً '+(delta>0?'للأمام':'للخلف'));return}
  if(el.hasAttribute('data-stations')){var list=el.value.split(/[،,]/).map(function(s){return s.trim()}).filter(Boolean);mutate(function(){state.meta.stations=list});return}
});
plan.addEventListener('click',function(e){
  var b;
  if((b=e.target.closest('[data-del-risk]'))){var id=b.dataset.delRisk;mutate(function(){state.risks=state.risks.filter(function(r){return r.id!==id})});return}
  if((b=e.target.closest('[data-edit]'))){openTask(b.dataset.edit);return}
  if((b=e.target.closest('[data-act="add-risk"]'))){mutate(function(){state.risks.push({id:uid('r'),risk:'',prob:'متوسطة',impact:'متوسط',mitigation:''})});var tas=$$('#panel-plan [data-bind$=":risk"]');if(tas.length)tas[tas.length-1].focus();return}
  if((b=e.target.closest('[data-act="add-phase"]'))){openPhase(null)}
});

/* ---------- global events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){ui.tab=b.dataset.tab;saveUi();renderTabs();return}
  if(b.dataset.zoom){ui.zoom=b.dataset.zoom;saveUi();var mid=G.d0+(-gEl.scrollLeft+gEl.clientWidth/2)/G.ppd;renderGantt();scrollToDay(Math.round(mid));return}
  var act=b.dataset.act;
  if(act==='hide-note'){ui.hideNote=true;saveUi();renderBanners()}
  else if(act==='discard-draft'){clearDraft();state=JSON.parse(JSON.stringify(pageState));schedule();dirty=false;hist=[];fut=[];draftBanner=null;renderAll()}
  else if(act==='restore-old'){snap();state=draft.state;schedule();draftBanner=null;changed()}
  else if(act==='drop-old'){clearDraft();draftBanner=null;renderBanners()}
});
$('#btn-today').addEventListener('click',function(){scrollToDay(TODAY>=G.d0&&TODAY<=G.d1?TODAY:stats().start)});
$('#btn-undo').addEventListener('click',undo);$('#btn-redo').addEventListener('click',redo);
$('#btn-add-task').addEventListener('click',function(){newTask(null)});
$('#btn-add-phase').addEventListener('click',function(){openPhase(null)});
$('#station-filter').addEventListener('change',function(e){ui.station=e.target.value;saveUi();renderGantt()});
$('#btn-save').addEventListener('click',save);
$('#btn-export').addEventListener('click',exportCsv);
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='z'||e.key==='Z')){var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;e.preventDefault();e.shiftKey?redo():undo()}
});

/* ---------- save / export ---------- */
function buildDoc(next){
  var hs=document.head.querySelector('style');
  var reset=hs?hs.textContent:'';
  var json=JSON.stringify(next).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+TITLE+'</title>'+$('#fonts').outerHTML+'<style id="app-css">'+$('#app-css').textContent+'</style><div id="app"></div>'+
    '<script type="application/json" id="plan-data">'+json+'<\/script><script id="app-js">'+$('#app-js').textContent+'<\/script></body></html>';
}
function save(){
  if(!art||saving||!dirty)return;
  saving=true;renderSave();
  var next=JSON.parse(JSON.stringify(state));next.rev=baseRev+1;next.meta.updated=new Date().toISOString();
  art.publish(buildDoc(next)).then(function(){clearDraft();dirty=false;saving=false;renderSave();toast('حُفظت الخطة، وتظهر الآن لكل من يفتح الرابط')})
  .catch(function(err){
    saving=false;var c=err&&err.code;
    if(c==='conflict')toast('حفظ شخص آخر نسخة أحدث وسيتم تحميلها الآن. تعديلاتك باقية كمسودة في هذا المتصفح.');
    else if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].indexOf(c)>=0){readOnly=true;toast('لا تملك صلاحية تعديل هذه الصفحة. تعديلاتك محفوظة في هذا المتصفح فقط.')}
    else if(c==='rate_limited')toast('محاولات حفظ كثيرة. انتظر دقيقة ثم احفظ مرة أخرى.');
    else if(c==='too_large')toast('الخطة أكبر من الحد المسموح للحفظ.');
    else toast('تعذّر الحفظ بسبب مشكلة في الاتصال. حاول مرة أخرى.');
    renderSave();
  });
}
function exportCsv(){
  if(!dl)return;
  var wb=wbsMap(),m=byId();
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['الرقم','المرحلة','المهمة','الموقع','البداية','النهاية','المدة (يوم)','الإنجاز %','الحالة','المسؤول','تبدأ بعد','ملاحظات']];
  state.phases.forEach(function(ph){T().forEach(function(t){if(t.phase!==ph.id)return;
    rows.push([wb[t.id],ph.name,t.name,t.station,t.start,diso(endDay(t)),t.ms?0:t.dur,t.progress||0,STLBL[status(t)],t.owner,t.preds.map(function(p){return wb[p]||''}).join(' '),t.notes])})});
  var csv='﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\r\n');
  dl.save({filename:'hafr-albatin-lifting-stations-schedule.csv',data:csv}).then(function(){toast('جُهّز ملف الجدول الزمني')}).catch(function(err){
    var c=err&&err.code;if(c==='declined')return;
    if(['unavailable','not_granted','capability_disabled','capability_removed'].indexOf(c)>=0){dl=null;$('#btn-export').hidden=true;return}
    toast(c==='rate_limited'?'نافذة حفظ مفتوحة بالفعل.':'تعذّر تجهيز الملف.');
  });
}

/* ---------- boot ---------- */
function renderAll(){renderHeader();renderBanners();renderKpis();renderTabs();renderGantt();renderPlan();renderSave()}
schedule();
renderAll();

if(window['cl'+'aude']&&typeof window['cl'+'aude'].use==='function'){
  window['cl'+'aude'].use('artifact').then(function(a){art=a;artKnown=true;renderSave()},function(){artKnown=true;renderSave()});
  window['cl'+'aude'].use('downloads').then(function(d){dl=d;$('#btn-export').hidden=!d});
}else{artKnown=true;renderSave()}
})();
</script>
